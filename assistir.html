<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E0C">
<meta name="color-scheme" content="dark">
<meta name="description" content="Reprodução do vídeo com sistema de continuar assistindo.">
<title>Xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  /* ---------- Tokens (mesmos das outras telas) ---------- */
  :root{
    --ink: #120E0C;
    --ink-line: rgba(245,238,228,0.12);
    --paper: #F5EEE4;
    --paper-dim: #B8AA9C;
    --marquee: #E7A33E;
    --marquee-press: #D3922E;
  }

  body{ background:var(--ink); overflow-x:hidden; }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Player de vídeo ---------- */
  .player-wrap{
    position:relative;
    max-width:960px;
    margin:0 auto;
    background:#000;
  }
  .video, .video-skeleton{
    width:100%;
    aspect-ratio:16/9;
    max-height:80vh;
    display:block;
    background:#000;
  }
  .video[hidden], .video-skeleton[hidden]{ display:none; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
  .video-skeleton{
    background:rgba(245,238,228,0.06);
    animation:pulse 1.6s ease-in-out infinite;
  }

  .back-btn{
    position:absolute;
    top:calc(14px + env(safe-area-inset-top,0px));
    left:20px;
    z-index:20;
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:rgba(18,14,12,0.6);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:var(--paper);
    text-decoration:none;
  }
  .back-btn svg{ width:20px; height:20px; }
  .back-btn:active{ background:rgba(18,14,12,0.85); }

  /* ---------- Informações abaixo do player ---------- */
  .app{
    max-width:520px;
    margin:0 auto;
    color:var(--paper);
    font-family:'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .detail-body{ padding:20px; }
  .detail-title{
    font-family:'Fraunces', Georgia, serif;
    font-weight:800;
    font-size:clamp(22px, 6vw, 28px);
    line-height:1.2;
    margin:0;
    color:var(--paper);
  }

  /* ---------- Estado de erro ---------- */
  .error-state{
    padding:40px 24px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .error-message{ font-size:15px; line-height:1.6; color:var(--paper-dim); max-width:38ch; margin:0; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:999px; padding:13px 24px;
    font-weight:600; font-size:14.5px; cursor:pointer; text-decoration:none;
  }
  .btn-secondary{ background:rgba(245,238,228,0.12); color:var(--paper); }
  .btn-secondary:active{ background:rgba(245,238,228,0.2); }
  .btn-primary{ background:var(--marquee); color:#1C1207; }
  .btn-primary:active{ background:var(--marquee-press); }

  /* ---------- Acessibilidade ---------- */
  a:focus-visible, button:focus-visible, video:focus-visible{
    outline:2px solid var(--marquee);
    outline-offset:2px;
    border-radius:6px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div id="sr-status" class="sr-only" role="status" aria-live="polite">Carregando vídeo…</div>

  <div id="player-wrap" class="player-wrap">
    <a id="back-link" class="back-btn" href="index.html" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div id="video-skeleton" class="video-skeleton" aria-hidden="true"></div>
    <video id="video" class="video" hidden controls playsinline preload="metadata"></video>
  </div>

  <div class="app">
    <div class="detail-body">
      <h1 id="movie-title" class="detail-title">Carregando…</h1>
    </div>

    <div id="error-state" class="error-state" hidden>
      <p id="error-message" class="error-message"></p>
      <a class="btn btn-secondary" href="index.html">Voltar para o início</a>
    </div>

    <div id="auth-required" class="error-state" hidden>
      <p class="error-message">Entre na sua conta para assistir e continuar de onde parou.</p>
      <a id="login-link" class="btn btn-primary" href="login.html">Entrar</a>
    </div>

    <div id="premium-required" class="error-state" hidden>
      <p class="error-message">Este título é exclusivo para assinantes Premium.</p>
      <a id="premium-link" class="btn btn-primary" href="premium.html">Assinar Premium</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  const SUPABASE_URL = 'https://uecyrwxajbdcrhnijlxv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_OUHFk8LAvyd2lfrmRkcK2A_EM6HD869';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* Tabelas no Supabase:
     filmes(id, titulo, descricao, genero, ano, capa, link, premium)
     continuar_assistindo(user_id, filme_id, tempo, duracao, titulo, capa, atualizado_em)
     perfis(user_id, premium)

     Esta página exige login (e-mail/senha, ver login.html). Sem sessão
     ativa, mostra um convite para entrar em vez de carregar o vídeo.
     Se o filme for premium e o usuário não for assinante, mostra um
     convite para assinar em vez de carregar o vídeo.                */

  const RESUME_MIN_SECONDS = 5;
  const RESUME_MAX_FRACTION = 0.95;
  const SAVE_INTERVAL_MS = 5000;

  const els = {
    playerWrap: document.getElementById('player-wrap'),
    video: document.getElementById('video'),
    videoSkeleton: document.getElementById('video-skeleton'),
    title: document.getElementById('movie-title'),
    backLink: document.getElementById('back-link'),
    errorState: document.getElementById('error-state'),
    errorMessage: document.getElementById('error-message'),
    authRequired: document.getElementById('auth-required'),
    loginLink: document.getElementById('login-link'),
    premiumRequired: document.getElementById('premium-required'),
    premiumLink: document.getElementById('premium-link'),
    srStatus: document.getElementById('sr-status'),
  };

  function showError(message) {
    els.playerWrap.hidden = true;
    els.authRequired.hidden = true;
    els.premiumRequired.hidden = true;
    els.errorState.hidden = false;
    els.errorMessage.textContent = message;
    els.srStatus.textContent = message;
    els.title.textContent = 'Não foi possível abrir';
  }

  const params = new URLSearchParams(window.location.search);
  const filmeId = params.get('id');

  if (!filmeId) {
    showError('Nenhum filme foi indicado na URL. Volte à tela inicial e escolha um título.');
  } else {
    els.backLink.href = 'detalhes.html?id=' + encodeURIComponent(filmeId);
    els.loginLink.href = 'login.html?redirect=' + encodeURIComponent('assistir.html?id=' + filmeId);
    els.premiumLink.href = 'premium.html?id=' + encodeURIComponent(filmeId);
    iniciar();
  }

  function iniciar() {
    let uid = null;
    let saveTimer = null;
    let lastSaved = -1;
    let carregado = false;
    let filmeDados = null;

    function verificarPremiumUsuario() {
      return supabase.from('perfis').select('premium').eq('user_id', uid).single()
        .then(function (res) { return !!(res.data && res.data.premium === true); })
        .catch(function () { return false; });
    }

    function salvarProgresso() {
      if (!uid || !els.video.duration || isNaN(els.video.duration)) return;
      const tempo = els.video.currentTime;
      if (Math.abs(tempo - lastSaved) < 1) return;
      lastSaved = tempo;
      supabase.from('continuar_assistindo').upsert({
        user_id: uid,
        filme_id: filmeId,
        titulo: (filmeDados && filmeDados.titulo) || '',
        capa: (filmeDados && filmeDados.capa) || '',
        tempo: tempo,
        duracao: els.video.duration,
        atualizado_em: new Date().toISOString()
      }).then(function (res) {
        if (res.error) console.error('Falha ao salvar progresso:', res.error);
      });
    }

    function limparProgresso() {
      if (!uid) return;
      supabase.from('continuar_assistindo').delete().eq('user_id', uid).eq('filme_id', filmeId)
        .then(function (res) { if (res.error) console.error(res.error); });
    }

    function iniciarSalvamentoPeriodico() {
      if (saveTimer) return;
      saveTimer = setInterval(salvarProgresso, SAVE_INTERVAL_MS);
    }
    function pararSalvamentoPeriodico() {
      clearInterval(saveTimer);
      saveTimer = null;
    }

    /* ------------------------------------------------------------
       Evento: salva o tempo atual no Supabase a cada poucos segundos
       (SAVE_INTERVAL_MS), vinculado ao filme (filmeId) e ao usuário
       (uid) na tabela continuar_assistindo. O timer roda enquanto o
       vídeo está tocando; pause, fim, troca de aba e fechamento da
       página disparam um salvamento imediato adicional.
       ------------------------------------------------------------ */
    els.video.addEventListener('play', iniciarSalvamentoPeriodico);
    els.video.addEventListener('pause', function () { pararSalvamentoPeriodico(); salvarProgresso(); });
    els.video.addEventListener('ended', function () { pararSalvamentoPeriodico(); limparProgresso(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') salvarProgresso();
    });
    window.addEventListener('pagehide', salvarProgresso);

    function carregarFilme() {
      if (carregado) return;
      carregado = true;

      supabase.from('filmes').select('*').eq('id', filmeId).single().then(function (res) {
        if (res.error || !res.data) {
          showError('Não encontramos esse título no catálogo.');
          return;
        }
        const dados = res.data;
        filmeDados = dados;

        function prosseguir() {
          if (!dados.link) {
            showError('Esse título ainda não tem um vídeo disponível.');
            return;
          }

          els.title.textContent = dados.titulo || 'Assistindo';
          document.title = (dados.titulo || 'Assistir') + ' — Xyz';
          els.video.src = dados.link;

          function mostrarVideo() {
            els.videoSkeleton.hidden = true;
            els.video.hidden = false;
            els.srStatus.textContent = (dados.titulo || 'Vídeo') + ' pronto para assistir.';
          }

          supabase.from('continuar_assistindo').select('*')
            .eq('user_id', uid).eq('filme_id', filmeId).maybeSingle()
            .then(function (res) {
              if (res.data) {
                const p = res.data;
                els.video.addEventListener('loadedmetadata', function () {
                  const duracao = els.video.duration;
                  const podeContinuar = p.tempo > RESUME_MIN_SECONDS &&
                    duracao && p.tempo < duracao * RESUME_MAX_FRACTION;
                  if (podeContinuar) { els.video.currentTime = p.tempo; }
                }, { once: true });
              }
              mostrarVideo();
            }).catch(function () { mostrarVideo(); });
        }

        if (dados.premium === true) {
          verificarPremiumUsuario().then(function (souPremium) {
            if (souPremium) {
              prosseguir();
            } else {
              els.videoSkeleton.hidden = true;
              els.premiumRequired.hidden = false;
              els.title.textContent = 'Conteúdo Premium';
              els.srStatus.textContent = 'Este título é exclusivo para assinantes Premium.';
            }
          });
        } else {
          prosseguir();
        }
      }).catch(function (e) {
        console.error(e);
        showError('Não foi possível carregar os dados agora. Verifique sua conexão e as políticas de acesso (RLS).');
      });
    }

    supabase.auth.getSession().then(function (sessionRes) {
      const session = sessionRes.data.session;
      if (session) {
        uid = session.user.id;
        carregarFilme();
      } else {
        els.videoSkeleton.hidden = true;
        els.authRequired.hidden = false;
        els.title.textContent = 'Entre para assistir';
        els.srStatus.textContent = 'É preciso entrar na conta para assistir a este vídeo.';
      }
    });
  }
</script>
</body>
</html>
