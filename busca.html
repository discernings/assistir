<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E0C">
<meta name="color-scheme" content="dark">
<meta name="description" content="Buscar filmes e séries.">
<title>Buscar — Xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; }

  :root{
    --ink: #120E0C;
    --ink-line: rgba(245,238,228,0.12);
    --paper: #F5EEE4;
    --paper-dim: #B8AA9C;
    --marquee: #E7A33E;
    --radius-card: 10px;
  }

  body{ background:#000; overflow-x:hidden; }
  .app{
    max-width:520px; margin:0 auto; min-height:100vh;
    background:var(--ink); color:var(--paper);
    font-family:'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  @media (min-width:560px){
    body{ background:#050403; }
    .app{ border-left:1px solid rgba(245,238,228,0.06); border-right:1px solid rgba(245,238,228,0.06); box-shadow:0 0 70px rgba(0,0,0,0.55); }
  }

  .nav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:10px;
    padding: calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
    background:rgba(18,14,12,0.85);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--ink-line);
  }
  .back-btn{
    width:38px; height:38px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(245,238,228,0.06);
    color:var(--paper); text-decoration:none;
  }
  .back-btn svg{ width:20px; height:20px; }
  .back-btn:active{ background:rgba(245,238,228,0.14); }

  .search-wrap{ flex:1; position:relative; }
  .search-wrap svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--paper-dim); pointer-events:none;
  }
  #search-input{
    width:100%;
    background:rgba(245,238,228,0.08);
    border:1px solid var(--ink-line);
    border-radius:999px;
    padding:11px 14px 11px 40px;
    font-size:15px; color:var(--paper); font-family:inherit;
  }
  #search-input:focus{ outline:none; border-color:var(--marquee); }
  #search-input::placeholder{ color:var(--paper-dim); }

  .catalog-state{ padding:80px 24px; text-align:center; }
  .catalog-state p{ color:var(--paper-dim); font-size:14.5px; line-height:1.6; margin:0; max-width:38ch; margin:0 auto; }

  .grid-container{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
    padding:18px 20px 40px;
  }
  @media (min-width:420px){ .grid-container{ grid-template-columns:repeat(3, 1fr); } }

  .poster{
    display:flex; align-items:flex-end; width:100%; aspect-ratio:2/3;
    border:none; padding:0; margin:0; border-radius:var(--radius-card);
    position:relative; overflow:hidden; text-align:left; cursor:pointer;
    background-color:#2A2540; background-size:cover; background-position:center;
    transition:transform .15s ease;
  }
  .poster::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 80% at 15% -10%, rgba(255,255,255,0.10), transparent 55%);
    pointer-events:none;
  }
  .poster:active{ transform:scale(0.96); }
  .poster-scrim{ display:block; width:100%; padding:8px 10px; background:linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0) 92%); }
  .poster-title{ display:block; font-size:12.5px; font-weight:600; line-height:1.25; color:var(--paper); }
  .card-premium-badge{
    position:absolute; top:8px; right:8px; z-index:2;
    font-size:10px; font-weight:700; padding:3px 7px;
    border-radius:999px; background:var(--marquee); color:#1C1207;
  }

  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--marquee); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="app">

  <header class="nav">
    <a class="back-btn" href="index.html" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" id="search-input" placeholder="Buscar filmes e séries" autofocus autocomplete="off">
    </div>
  </header>

  <div id="prompt-state" class="catalog-state"><p>Digite para buscar no catálogo.</p></div>
  <div id="loading-state" class="catalog-state" hidden><p>Buscando…</p></div>
  <div id="empty-state" class="catalog-state" hidden><p>Nenhum título encontrado.</p></div>
  <div id="error-state" class="catalog-state" hidden><p id="error-message"></p></div>

  <main id="grid-container" class="grid-container" hidden></main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  const SUPABASE_URL = 'https://uecyrwxajbdcrhnijlxv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_OUHFk8LAvyd2lfrmRkcK2A_EM6HD869';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const els = {
    input: document.getElementById('search-input'),
    promptState: document.getElementById('prompt-state'),
    loadingState: document.getElementById('loading-state'),
    emptyState: document.getElementById('empty-state'),
    errorState: document.getElementById('error-state'),
    errorMessage: document.getElementById('error-message'),
    gridContainer: document.getElementById('grid-container'),
  };

  function esconderTudo() {
    els.promptState.hidden = true;
    els.loadingState.hidden = true;
    els.emptyState.hidden = true;
    els.errorState.hidden = true;
    els.gridContainer.hidden = true;
  }

  function criarCard(filme) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'poster';
    if (filme.capa) { btn.style.backgroundImage = "url('" + filme.capa + "')"; }
    btn.addEventListener('click', function () {
      window.location.href = 'detalhes.html?id=' + encodeURIComponent(filme.id);
    });

    const scrim = document.createElement('span');
    scrim.className = 'poster-scrim';
    const title = document.createElement('span');
    title.className = 'poster-title';
    title.textContent = filme.titulo || 'Sem título';
    scrim.appendChild(title);
    btn.appendChild(scrim);

    if (filme.premium === true) {
      const badge = document.createElement('span');
      badge.className = 'card-premium-badge';
      badge.textContent = 'Premium';
      btn.appendChild(badge);
    }
    return btn;
  }

  let timer = null;
  let ultimaBusca = '';

  function buscar(termo) {
    esconderTudo();
    els.loadingState.hidden = false;

    supabase.from('filmes').select('*').ilike('titulo', '%' + termo + '%').then(function (res) {
      if (termo !== ultimaBusca) return; // resposta antiga chegando atrasada, ignora
      esconderTudo();
      if (res.error) {
        console.error(res.error);
        els.errorState.hidden = false;
        els.errorMessage.textContent = 'Não foi possível buscar agora. Tente novamente.';
        return;
      }
      const filmes = res.data || [];
      if (filmes.length === 0) {
        els.emptyState.hidden = false;
        return;
      }
      const frag = document.createDocumentFragment();
      filmes.forEach(function (filme) { frag.appendChild(criarCard(filme)); });
      els.gridContainer.innerHTML = '';
      els.gridContainer.appendChild(frag);
      els.gridContainer.hidden = false;
    });
  }

  els.input.addEventListener('input', function () {
    const termo = els.input.value.trim();
    ultimaBusca = termo;
    clearTimeout(timer);
    if (!termo) { esconderTudo(); els.promptState.hidden = false; return; }
    timer = setTimeout(function () { buscar(termo); }, 350);
  });
</script>
</body>
</html>
