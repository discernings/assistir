<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E0C">
<meta name="color-scheme" content="dark">
<meta name="description" content="Página de detalhes de um filme ou série: capa, sinopse e botão para assistir.">
<title>Xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  /* ---------- Tokens (mesmos da tela index, para manter a identidade) ---------- */
  :root{
    --ink: #120E0C;
    --ink-line: rgba(245,238,228,0.12);
    --paper: #F5EEE4;
    --paper-dim: #B8AA9C;
    --paper-faint: #9C8F80;
    --marquee: #E7A33E;
    --marquee-press: #D3922E;
  }

  /* ---------- Base / app shell ---------- */
  body{ background:#000; overflow-x:hidden; }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--ink);
    color:var(--paper);
    font-family:'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position:relative;
  }
  @media (min-width:560px){
    body{ background:#050403; }
    .app{
      border-left:1px solid rgba(245,238,228,0.06);
      border-right:1px solid rgba(245,238,228,0.06);
      box-shadow:0 0 70px rgba(0,0,0,0.55);
    }
  }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Botão voltar ---------- */
  .back-btn{
    position:absolute;
    top:calc(14px + env(safe-area-inset-top,0px));
    left:20px;
    z-index:20;
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:rgba(18,14,12,0.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:var(--paper);
    text-decoration:none;
  }
  .back-btn svg{ width:20px; height:20px; }
  .back-btn:active{ background:rgba(18,14,12,0.8); }

  /* ---------- Capa ---------- */
  .cover-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:#1C1613;
  }
  .cover-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cover-wrap::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(18,14,12,0) 60%, var(--ink) 100%);
    pointer-events:none;
  }

  /* ---------- Conteúdo ---------- */
  .detail-body{ padding:20px 20px 40px; }
  .detail-title{
    font-family:'Fraunces', Georgia, serif;
    font-weight:900;
    font-size:clamp(26px, 7vw, 34px);
    line-height:1.1;
    margin:0 0 14px;
    color:var(--paper);
  }
  .genre-list{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
  .genre-chip{
    font-size:13px;
    padding:6px 14px;
    border-radius:999px;
    background:rgba(245,238,228,0.08);
    border:1px solid var(--ink-line);
    color:var(--paper-dim);
  }
  .detail-description{
    font-size:15px;
    line-height:1.6;
    color:var(--paper-dim);
    max-width:60ch;
    margin:0 0 26px;
  }

  /* ---------- Botões ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:999px;
    padding:14px 26px;
    font-weight:600; font-size:15px;
    cursor:pointer; text-decoration:none;
  }
  .btn svg{ width:17px; height:17px; flex:0 0 auto; }
  .btn-primary{ width:100%; background:var(--marquee); color:#1C1207; }
  .btn-primary:active{ background:var(--marquee-press); }
  .btn-secondary{ background:rgba(245,238,228,0.12); color:var(--paper); }
  .btn-secondary:active{ background:rgba(245,238,228,0.2); }
  .btn--disabled{ opacity:0.5; pointer-events:none; }

  /* ---------- Skeleton (carregando) ---------- */
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
  .skeleton-cover{
    width:100%; aspect-ratio:16/9;
    background:rgba(245,238,228,0.08);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .skeleton-body{ padding:20px; }
  .skeleton-line{
    height:14px; border-radius:6px;
    background:rgba(245,238,228,0.08);
    margin-bottom:12px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  .skeleton-line--title{ height:30px; width:70%; margin-bottom:18px; }
  .skeleton-line--chip{ height:24px; width:100px; border-radius:999px; margin-bottom:18px; }

  /* ---------- Estado de erro ---------- */
  .error-state{
    padding:96px 24px 40px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .error-message{ font-size:15px; line-height:1.6; color:var(--paper-dim); max-width:38ch; margin:0; }
  .premium-badge{
    display:inline-block;
    font-size:12px; font-weight:700;
    padding:5px 12px;
    border-radius:999px;
    background:var(--marquee);
    color:#1C1207;
    margin:0 0 12px;
  }

  /* ---------- Acessibilidade ---------- */
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--marquee);
    outline-offset:2px;
    border-radius:6px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <div id="sr-status" class="sr-only" role="status" aria-live="polite">Carregando informações do filme…</div>

  <a class="back-btn" href="index.html" aria-label="Voltar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>

  <main>
    <!-- Carregando -->
    <div id="skeleton" class="skeleton" aria-hidden="true">
      <div class="skeleton-cover"></div>
      <div class="skeleton-body">
        <div class="skeleton-line skeleton-line--title"></div>
        <div class="skeleton-line skeleton-line--chip"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line" style="width:55%"></div>
      </div>
    </div>

    <!-- Conteúdo real -->
    <div id="content" class="content" hidden>
      <div class="cover-wrap">
        <img id="cover-img" class="cover-img" alt="">
      </div>
      <div class="detail-body">
        <span id="premium-badge" class="premium-badge" hidden>Premium</span>
        <h1 id="movie-title" class="detail-title"></h1>
        <div id="movie-genres" class="genre-list"></div>
        <p id="movie-description" class="detail-description"></p>
        <a id="watch-btn" class="btn btn-primary btn--disabled" href="#" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5-13-7.5z"></path></svg>
          <span id="watch-btn-label">Assistir</span>
        </a>
      </div>
    </div>

    <!-- Erro / não encontrado -->
    <div id="error-state" class="error-state" hidden>
      <p id="error-message" class="error-message"></p>
      <a class="btn btn-secondary" href="index.html">Voltar para o início</a>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  const SUPABASE_URL = 'https://uecyrwxajbdcrhnijlxv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_OUHFk8LAvyd2lfrmRkcK2A_EM6HD869';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* Tabelas no Supabase:
     filmes(id, titulo, descricao, genero, ano, capa, link, premium)
     perfis(user_id, premium) -> checado quando o filme é premium     */

  const els = {
    skeleton: document.getElementById('skeleton'),
    content: document.getElementById('content'),
    errorState: document.getElementById('error-state'),
    errorMessage: document.getElementById('error-message'),
    cover: document.getElementById('cover-img'),
    title: document.getElementById('movie-title'),
    genres: document.getElementById('movie-genres'),
    description: document.getElementById('movie-description'),
    premiumBadge: document.getElementById('premium-badge'),
    watchBtn: document.getElementById('watch-btn'),
    watchBtnLabel: document.getElementById('watch-btn-label'),
    srStatus: document.getElementById('sr-status'),
  };

  function showError(message) {
    els.skeleton.hidden = true;
    els.content.hidden = true;
    els.errorState.hidden = false;
    els.errorMessage.textContent = message;
    els.srStatus.textContent = message;
  }

  function verificarPremiumUsuario(uid) {
    if (!uid) return Promise.resolve(false);
    return supabase.from('perfis').select('premium').eq('user_id', uid).single()
      .then(function (res) { return !!(res.data && res.data.premium === true); })
      .catch(function () { return false; });
  }

  function renderMovie(data, souPremium) {
    els.skeleton.hidden = true;
    els.errorState.hidden = true;

    const titulo = data.titulo || 'Título indisponível';
    document.title = titulo + ' — Xyz';
    els.title.textContent = titulo;
    els.description.textContent = data.descricao || 'Sinopse não disponível.';

    els.cover.onerror = function () { els.cover.style.display = 'none'; };
    if (data.capa) { els.cover.src = data.capa; }

    els.genres.innerHTML = '';
    [data.ano, data.genero].filter(Boolean).forEach(function (texto) {
      const chip = document.createElement('span');
      chip.className = 'genre-chip';
      chip.textContent = texto;
      els.genres.appendChild(chip);
    });

    const ehPremium = data.premium === true;
    els.premiumBadge.hidden = !ehPremium;
    const precisaAssinar = ehPremium && !souPremium;

    if (precisaAssinar) {
      els.watchBtn.href = 'premium.html?id=' + encodeURIComponent(data.id);
      els.watchBtnLabel.textContent = 'Assinar para assistir';
      els.watchBtn.classList.remove('btn--disabled');
      els.watchBtn.removeAttribute('aria-disabled');
    } else if (data.link) {
      els.watchBtn.href = 'assistir.html?id=' + encodeURIComponent(data.id);
      els.watchBtnLabel.textContent = 'Assistir';
      els.watchBtn.classList.remove('btn--disabled');
      els.watchBtn.removeAttribute('aria-disabled');
    } else {
      els.watchBtn.removeAttribute('href');
      els.watchBtnLabel.textContent = 'Assistir';
      els.watchBtn.classList.add('btn--disabled');
      els.watchBtn.setAttribute('aria-disabled', 'true');
    }

    els.content.hidden = false;
    els.srStatus.textContent = titulo + ' carregado.';
  }

  function iniciar() {
    const params = new URLSearchParams(window.location.search);
    const filmeId = params.get('id');

    if (!filmeId) {
      showError('Nenhum filme foi indicado na URL. Volte à tela inicial e escolha um título (o link precisa incluir ?id=...).');
      return;
    }

    supabase.from('filmes').select('*').eq('id', filmeId).single().then(function (res) {
      if (res.error || !res.data) {
        showError('Não encontramos esse título no catálogo.');
        return;
      }
      const dados = res.data;

      supabase.auth.getSession().then(function (sessionRes) {
        const uid = sessionRes.data.session ? sessionRes.data.session.user.id : null;
        verificarPremiumUsuario(uid).then(function (souPremium) {
          renderMovie(dados, souPremium);
        });
      });
    }).catch(function (error) {
      console.error(error);
      showError('Não foi possível carregar os dados agora. Verifique sua conexão e as políticas de acesso (RLS) da tabela "filmes".');
    });
  }

  iniciar();
</script>
</body>
</html>
