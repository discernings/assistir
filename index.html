<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E0C">
<meta name="color-scheme" content="dark">
<meta name="description" content="Tela inicial de um app de streaming, com banner de destaque e listas horizontais de filmes e séries.">
<title>Xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  /* CORREÇÃO CRÍTICA: sem isso, classes que definem "display" (como .btn,
     .error-state) sobrescrevem o atributo hidden e o elemento nunca some. */
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; }

  /* ---------- Tokens ---------- */
  :root{
    --ink: #120E0C;
    --ink-line: rgba(245,238,228,0.12);
    --paper: #F5EEE4;
    --paper-dim: #B8AA9C;
    --paper-faint: #9C8F80;
    --marquee: #E7A33E;
    --marquee-press: #D3922E;
    --radius-card: 10px;
  }

  /* ---------- Base ---------- */
  body{
    background:#000;
    overflow-x:hidden;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--ink);
    color:var(--paper);
    font-family:'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  @media (min-width:560px){
    body{ background:#050403; }
    .app{
      border-left:1px solid rgba(245,238,228,0.06);
      border-right:1px solid rgba(245,238,228,0.06);
      box-shadow:0 0 70px rgba(0,0,0,0.55);
    }
  }

  /* ---------- Nav ---------- */
  .nav{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
    background:rgba(18,14,12,0.78);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--ink-line);
  }
  .brand{
    font-family:'Fraunces', Georgia, serif;
    font-weight:700;
    font-size:21px;
    color:var(--marquee);
  }
  .nav-actions{ display:flex; gap:4px; }
  .icon-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:50%;
    cursor:pointer;
  }
  .icon-btn svg{ width:20px; height:20px; }
  .icon-btn:active{ background:rgba(245,238,228,0.08); }
  a.icon-btn{ color:inherit; text-decoration:none; }

  /* ---------- Estado de carregamento / vazio / erro do catálogo ---------- */
  .catalog-state{
    padding:80px 24px;
    text-align:center;
  }
  .catalog-state p{
    color:var(--paper-dim);
    font-size:14.5px;
    line-height:1.6;
    margin:0;
    max-width:38ch;
    margin:0 auto;
  }

  /* ---------- Hero (carrossel com swipe) ---------- */
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  #main-content{ animation: fadeIn .35s ease both; }
  .hero-carousel{ position:relative; }
  .hero-track{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .hero-track::-webkit-scrollbar{ display:none; }
  .hero-slide{
    flex:0 0 100%;
    scroll-snap-align:start;
    position:relative;
    padding:26px 20px 30px;
    min-height:clamp(400px, 58vh, 540px);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    background:
      radial-gradient(130% 100% at 25% 8%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%),
      linear-gradient(to top, var(--ink) 0%, rgba(18,14,12,0.06) 55%, rgba(18,14,12,0) 72%),
      #4B1E2F;
    background-size:cover;
    background-position:center;
  }
  @keyframes heroFadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .hero-slide > *{ animation:heroFadeUp .5s ease both; }
  .hero-slide > *:nth-child(2){ animation-delay:.05s; }
  .hero-slide > *:nth-child(3){ animation-delay:.1s; }
  .hero-slide > *:nth-child(4){ animation-delay:.15s; }
  .hero-dots{
    position:absolute;
    bottom:14px; left:0; right:0;
    display:flex;
    justify-content:center;
    gap:6px;
    z-index:2;
    pointer-events:none;
  }
  .hero-dot{
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(245,238,228,0.35);
    transition:background .2s ease, width .2s ease;
  }
  .hero-dot--active{ background:var(--marquee); width:18px; border-radius:3px; }
  .hero-meta{
    display:flex;
    flex-wrap:wrap;
    margin:0 0 14px;
    min-height:17px;
  }
  .hero-meta span{
    font-size:12.5px;
    color:var(--paper-dim);
    padding-left:10px;
    margin-left:10px;
    border-left:1px solid var(--ink-line);
    line-height:1.4;
  }
  .hero-meta span:first-child{ padding-left:0; margin-left:0; border-left:none; }
  .hero-title{
    font-family:'Fraunces', Georgia, serif;
    font-weight:900;
    font-size:clamp(32px, 9vw, 42px);
    line-height:1.05;
    margin:0 0 14px;
    color:var(--paper);
    min-height:1em;
  }
  .hero-synopsis{
    font-size:14.5px;
    line-height:1.55;
    color:var(--paper-dim);
    max-width:42ch;
    margin:0 0 20px;
  }
  .hero-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius:999px;
    padding:13px 22px;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    text-decoration:none;
  }
  .btn svg{ width:16px; height:16px; flex:0 0 auto; }
  .btn-primary{ flex:1; background:var(--marquee); color:#1C1207; }
  .btn-primary:active{ background:var(--marquee-press); }
  .btn-secondary{ background:rgba(245,238,228,0.12); color:var(--paper); }
  .btn-secondary:active{ background:rgba(245,238,228,0.2); }

  /* ---------- Abas de categoria (tipo) ---------- */
  .type-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 20px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .type-tabs::-webkit-scrollbar{ display:none; }
  .type-tab{
    flex:0 0 auto;
    border:none;
    padding:9px 18px;
    border-radius:999px;
    background:rgba(245,238,228,0.08);
    color:var(--paper-dim);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .type-tab--active{ background:var(--marquee); color:#1C1207; }

  /* ---------- Rows ---------- */
  .row{ padding:22px 0 2px; }
  .row-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:0 20px;
    margin:0 0 12px;
  }
  .row-title{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:19px;
    margin:0;
    color:var(--paper);
  }
  .row-see-all{
    flex:0 0 auto;
    font-size:12.5px;
    font-weight:600;
    color:var(--paper-dim);
    text-decoration:none;
    padding:4px 0 4px 12px;
  }
  .row-see-all:active{ color:var(--marquee); }
  .row-scroll{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:4px 20px 10px;
    scroll-snap-type:x proximity;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .row-scroll::-webkit-scrollbar{ display:none; }

  /* ---------- Cards ---------- */
  .card{ flex:0 0 150px; scroll-snap-align:start; }
  .poster{
    display:flex;
    align-items:flex-end;
    width:100%;
    aspect-ratio:16/10;
    border:none;
    padding:0;
    margin:0;
    border-radius:var(--radius-card);
    position:relative;
    overflow:hidden;
    text-align:left;
    cursor:pointer;
    transition:transform .15s ease;
    background-size:cover;
    background-position:center;
  }
  .poster::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(120% 80% at 15% -10%, rgba(255,255,255,0.10), transparent 55%);
    pointer-events:none;
  }
  .card:active .poster{ transform:scale(0.96); }
  .poster-scrim{
    display:block;
    width:100%;
    padding:8px 10px;
    background:linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0) 92%);
  }
  .poster-title{
    display:block;
    font-size:12.5px;
    font-weight:600;
    line-height:1.25;
    color:var(--paper);
  }
  .card-premium-badge{
    position:absolute;
    top:8px; right:8px;
    z-index:2;
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    background:var(--marquee);
    color:#1C1207;
  }

  /* ---------- Progress (continuar assistindo) ---------- */
  .progress{
    height:3px;
    margin-top:8px;
    border-radius:2px;
    background:rgba(245,238,228,0.14);
    overflow:hidden;
  }
  .progress span{ display:block; height:100%; background:var(--marquee); border-radius:2px; }

  /* ---------- Fileira ranqueada (reservado para uso futuro, ex. mais vistos) ---------- */
  .card--ranked{ flex:0 0 176px; display:flex; align-items:flex-end; }
  .card--ranked .poster{ width:150px; flex:0 0 150px; }
  .rank{
    flex:0 0 auto;
    font-family:'Fraunces', Georgia, serif;
    font-weight:900;
    font-size:58px;
    line-height:0.75;
    margin-right:-12px;
    position:relative;
    z-index:2;
    color:rgba(245,238,228,0.5);
    -webkit-text-stroke:1.5px rgba(245,238,228,0.55);
    -webkit-text-fill-color:transparent;
  }

  /* ---------- Tab bar ---------- */
  .tab-bar{
    position:sticky;
    bottom:0;
    z-index:50;
    display:flex;
    margin-top:18px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
    background:rgba(18,14,12,0.9);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--ink-line);
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    border:none;
    padding:8px 4px;
    cursor:pointer;
    color:var(--paper-faint);
  }
  .tab svg{ width:21px; height:21px; }
  .tab span{ font-size:11px; font-weight:500; }
  .tab--active{ color:var(--marquee); }
  a.tab{ text-decoration:none; }
  .tab-icon-wrap{ position:relative; display:inline-flex; }
  .tab-crown{
    position:absolute; top:-8px; right:-9px;
    width:13px; height:13px;
    color:var(--marquee);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.6));
  }

  /* ---------- Accessibility ---------- */
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--marquee);
    outline-offset:2px;
    border-radius:6px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  /* ---------- Cores de fallback dos pôsteres ----------
     Usadas como cor de fundo enquanto a capa (Supabase) carrega, ou
     como fallback caso a URL da capa falhe. */
  .p1{ background-color:#6E2530; }
  .p2{ background-color:#1F3B2C; }
  .p3{ background-color:#2A2540; }
  .p4{ background-color:#4A3324; }
  .p5{ background-color:#163539; }
  .p6{ background-color:#3C3B22; }
  .p7{ background-color:#4B1E2F; }
  .p8{ background-color:#23324A; }
</style>
</head>
<body>
<div class="app">

  <header class="nav">
    <span class="brand">Xyz</span>
    <div class="nav-actions">
      <a class="icon-btn" href="busca.html" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

      <a class="icon-btn" href="perfil.html" aria-label="Perfil">

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  const SUPABASE_URL = 'https://uecyrwxajbdcrhnijlxv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_OUHFk8LAvyd2lfrmRkcK2A_EM6HD869';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* Tabelas no Supabase:
     filmes(id, titulo, descricao, genero, ano, capa, link, premium)
     continuar_assistindo(user_id, filme_id, tempo, duracao, titulo, capa, atualizado_em)
     perfis(user_id, premium)

     Esta página busca TODOS os filmes de "filmes" e monta uma fileira
     por gênero automaticamente. O banner de destaque usa o primeiro
     filme encontrado. */

  const els = {
    loadingState: document.getElementById('loading-state'),
    emptyState: document.getElementById('empty-state'),
    errorState: document.getElementById('error-state'),
    errorMessage: document.getElementById('error-message'),
    mainContent: document.getElementById('main-content'),
    typeTabs: document.getElementById('type-tabs'),
    heroTrack: document.getElementById('hero-track'),
    heroDots: document.getElementById('hero-dots'),
    rowsContainer: document.getElementById('rows-container'),
  };

  const HERO_MAX_SLIDES = 5;

  let posterIndex = 0;
  const POSTER_CLASSES = ['p1','p2','p3','p4','p5','p6','p7','p8'];
  function proximaCorPoster() {
    const c = POSTER_CLASSES[posterIndex % POSTER_CLASSES.length];
    posterIndex++;
    return c;
  }

  function criarCard(filme) {
    const article = document.createElement('article');
    article.className = 'card';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'poster ' + proximaCorPoster();
    if (filme.capa) { btn.style.backgroundImage = "url('" + filme.capa + "')"; }
    btn.addEventListener('click', function () {
      window.location.href = 'detalhes.html?id=' + encodeURIComponent(filme.id);
    });

    const scrim = document.createElement('span');
    scrim.className = 'poster-scrim';
    const titleSpan = document.createElement('span');
    titleSpan.className = 'poster-title';
    titleSpan.textContent = filme.titulo || 'Sem título';
    scrim.appendChild(titleSpan);
    btn.appendChild(scrim);

    if (filme.premium === true) {
      const badge = document.createElement('span');
      badge.className = 'card-premium-badge';
      badge.textContent = 'Premium';
      btn.appendChild(badge);
    }

    article.appendChild(btn);

    if (typeof filme._progressoPct === 'number') {
      const progress = document.createElement('div');
      progress.className = 'progress';
      const bar = document.createElement('span');
      bar.style.width = filme._progressoPct + '%';
      progress.appendChild(bar);
      article.appendChild(progress);
    }

    return article;
  }

  function criarRow(id, titulo, filmes, verTodosHref) {
    const section = document.createElement('section');
    section.className = 'row';
    section.setAttribute('aria-labelledby', id);

    const header = document.createElement('div');
    header.className = 'row-header';

    const h2 = document.createElement('h2');
    h2.id = id;
    h2.className = 'row-title';
    h2.textContent = titulo;
    header.appendChild(h2);

    if (verTodosHref) {
      const verTodos = document.createElement('a');
      verTodos.className = 'row-see-all';
      verTodos.href = verTodosHref;
      verTodos.textContent = 'Ver todos';
      header.appendChild(verTodos);
    }
    section.appendChild(header);

    const scroll = document.createElement('div');
    scroll.className = 'row-scroll';
    filmes.forEach(function (filme) { scroll.appendChild(criarCard(filme)); });
    section.appendChild(scroll);

    return section;
  }

  function carregarContinuarAssistindo(uid) {
    return supabase.from('continuar_assistindo')
      .select('*')
      .eq('user_id', uid)
      .order('atualizado_em', { ascending: false })
      .then(function (res) {
        if (res.error || !res.data) return [];
        return res.data.map(function (item) {
          const pct = item.duracao ? Math.min(100, Math.max(0, (item.tempo / item.duracao) * 100)) : 0;
          return { id: item.filme_id, titulo: item.titulo, capa: item.capa, _progressoPct: pct };
        });
      }).catch(function () { return []; });
  }

  function criarHeroSlide(filme, uid) {
    const slide = document.createElement('div');
    slide.className = 'hero-slide';
    if (filme.capa) {
      slide.style.backgroundImage =
        "radial-gradient(130% 100% at 25% 8%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%), " +
        "linear-gradient(to top, var(--ink) 0%, rgba(18,14,12,0.06) 55%, rgba(18,14,12,0) 72%), " +
        "url('" + filme.capa + "')";
    }

    const meta = document.createElement('div');
    meta.className = 'hero-meta';
    [filme.ano, filme.genero].filter(Boolean).forEach(function (texto) {
      const span = document.createElement('span');
      span.textContent = texto;
      meta.appendChild(span);
    });
    slide.appendChild(meta);

    const title = document.createElement('h1');
    title.className = 'hero-title';
    title.textContent = filme.titulo || '';
    slide.appendChild(title);

    const synopsis = document.createElement('p');
    synopsis.className = 'hero-synopsis';
    synopsis.textContent = filme.descricao || '';
    slide.appendChild(synopsis);

    const actions = document.createElement('div');
    actions.className = 'hero-actions';

    const playBtn = document.createElement('a');
    playBtn.className = 'btn btn-primary';
    playBtn.href = 'assistir.html?id=' + encodeURIComponent(filme.id);
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5-13-7.5z"></path></svg><span>Assistir</span>';

    function aplicarBotaoAssistir(souPremium) {
      const precisaAssinar = filme.premium === true && !souPremium;
      if (precisaAssinar) {
        playBtn.href = 'premium.html?id=' + encodeURIComponent(filme.id);
        playBtn.querySelector('span').textContent = 'Assinar para assistir';
      } else {
        playBtn.href = 'assistir.html?id=' + encodeURIComponent(filme.id);
        playBtn.querySelector('span').textContent = 'Assistir';
      }
    }
    if (filme.premium === true && uid) {
      supabase.from('perfis').select('premium').eq('user_id', uid).single().then(function (res) {
        aplicarBotaoAssistir(!!(res.data && res.data.premium === true));
      }).catch(function () { aplicarBotaoAssistir(false); });
    } else {
      aplicarBotaoAssistir(false);
    }

    const detailsBtn = document.createElement('a');
    detailsBtn.className = 'btn btn-secondary';
    detailsBtn.href = 'detalhes.html?id=' + encodeURIComponent(filme.id);
    detailsBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.9" fill="currentColor" stroke="none"></circle></svg>Detalhes';

    actions.appendChild(playBtn);
    actions.appendChild(detailsBtn);
    slide.appendChild(actions);

    return slide;
  }

  function montarCarrosselHero(listaFilmes, uid) {
    const destaques = listaFilmes.slice(0, HERO_MAX_SLIDES);
    els.heroTrack.innerHTML = '';
    els.heroDots.innerHTML = '';
    els.heroDots.hidden = false;

    destaques.forEach(function (filme, i) {
      els.heroTrack.appendChild(criarHeroSlide(filme, uid));
      const dot = document.createElement('span');
      dot.className = 'hero-dot' + (i === 0 ? ' hero-dot--active' : '');
      els.heroDots.appendChild(dot);
    });

    if (destaques.length <= 1) { els.heroDots.hidden = true; return; }

    const dots = els.heroDots.querySelectorAll('.hero-dot');
    let ticking = false;
    els.heroTrack.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        const largura = els.heroTrack.clientWidth || 1;
        const idx = Math.round(els.heroTrack.scrollLeft / largura);
        dots.forEach(function (dot, i) { dot.classList.toggle('hero-dot--active', i === idx); });
        ticking = false;
      });
    });
  }

  // Um filme pode ter mais de um gênero: "Ação, Ficção Científica" ou
  // "Ação - Ficção Científica" (o hífen só separa se tiver espaço dos
  // dois lados, então "Super-herói" continua intacto).
  function generosDoFilme(filme) {
    if (!filme.genero) return [];
    return filme.genero.split(/\s*,\s*|\s+-\s+/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  let listaFilmesCompleta = [];
  let uidAtual = null;
  let tipoAtivo = 'Todos';

  function montarTabs(tipos) {
    const opcoes = ['Todos'].concat(tipos);
    els.typeTabs.innerHTML = '';
    if (opcoes.length <= 1) { els.typeTabs.hidden = true; return; }
    els.typeTabs.hidden = false;

    opcoes.forEach(function (tipo) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'type-tab' + (tipo === tipoAtivo ? ' type-tab--active' : '');
      btn.textContent = tipo;
      btn.addEventListener('click', function () {
        if (tipoAtivo === tipo) return;
        tipoAtivo = tipo;
        els.typeTabs.querySelectorAll('.type-tab').forEach(function (b) {
          b.classList.toggle('type-tab--active', b === btn);
        });
        renderizarConteudo();
      });
      els.typeTabs.appendChild(btn);
    });
  }

  function renderizarConteudo() {
    const filtrados = tipoAtivo === 'Todos'
      ? listaFilmesCompleta
      : listaFilmesCompleta.filter(function (f) { return f.tipo === tipoAtivo; });

    if (filtrados.length === 0) {
      els.heroTrack.innerHTML = '';
      els.heroDots.innerHTML = '';
      els.heroDots.hidden = true;
      els.rowsContainer.innerHTML = '<div class="catalog-state"><p>Nada por aqui ainda nessa categoria.</p></div>';
      return;
    }

    montarCarrosselHero(filtrados, uidAtual);

    const continuarPromise = uidAtual ? carregarContinuarAssistindo(uidAtual) : Promise.resolve([]);

    continuarPromise.then(function (itensContinuar) {
      const frag = document.createDocumentFragment();

      if (itensContinuar.length) {
        frag.appendChild(criarRow('row-continuar', 'Continuar assistindo', itensContinuar));
      }

      const grupos = {};
      const ordemGeneros = [];
      filtrados.forEach(function (filme) {
        generosDoFilme(filme).forEach(function (g) {
          if (!grupos[g]) { grupos[g] = []; ordemGeneros.push(g); }
          grupos[g].push(filme);
        });
      });

      ordemGeneros.forEach(function (genero, i) {
        const params = new URLSearchParams();
        params.set('genero', genero);
        if (tipoAtivo !== 'Todos') params.set('tipo', tipoAtivo);
        frag.appendChild(criarRow('row-genero-' + i, genero, grupos[genero], 'categoria.html?' + params.toString()));
      });

      els.rowsContainer.innerHTML = '';
      els.rowsContainer.appendChild(frag);
    });
  }

  function iniciar() {
    supabase.from('filmes').select('*').then(function (res) {
      if (res.error) {
        console.error(res.error);
        els.loadingState.hidden = true;
        els.errorState.hidden = false;
        els.errorMessage.textContent = 'Não foi possível carregar o catálogo agora. Verifique sua conexão e as políticas de acesso (RLS) da tabela "filmes".';
        return;
      }
      listaFilmesCompleta = res.data || [];
      if (listaFilmesCompleta.length === 0) {
        els.loadingState.hidden = true;
        els.emptyState.hidden = false;
        return;
      }

      const tiposUnicos = [];
      listaFilmesCompleta.forEach(function (f) {
        if (f.tipo && tiposUnicos.indexOf(f.tipo) === -1) tiposUnicos.push(f.tipo);
      });

      supabase.auth.getSession().then(function (sessionRes) {
        uidAtual = sessionRes.data.session ? sessionRes.data.session.user.id : null;
        montarTabs(tiposUnicos);
        renderizarConteudo();
        els.loadingState.hidden = true;
        els.mainContent.hidden = false;
      });
    });
  }

  iniciar();
</script>
